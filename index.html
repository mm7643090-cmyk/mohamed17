<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق السياحة الذكي - Tourism Smart App</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #48bb78;
            --danger: #f56565;
            --info: #4299e1;
            --light: #f7fafc;
            --dark: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            font-size: 40px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            background: var(--light);
            color: var(--dark);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Main Content */
        .content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 25px;
            transition: all 0.3s;
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light);
        }

        .card-icon {
            font-size: 28px;
        }

        .card-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
        }

        .card-subtitle {
            color: #a0aec0;
            font-size: 14px;
            margin-top: 5px;
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin: 15px 0;
        }

        .card-text {
            color: #4a5568;
            line-height: 1.6;
            font-size: 14px;
            margin: 10px 0;
        }

        .badge-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Forms */
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #38a169);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #e53e3e);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, var(--info), #2c5aa0);
            color: white;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* Search Bar */
        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-bar input,
        .search-bar select {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 8px;
        }

        /* Login */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-form h2 {
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table thead {
            background: var(--light);
        }

        .table th {
            padding: 12px;
            text-align: right;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid #e2e8f0;
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
        }

        .table tr:hover {
            background: var(--light);
        }

        /* Location Info */
        .location-info {
            background: linear-gradient(135deg, #f0f4ff, #f5f0ff);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
            color: var(--primary);
            border-left: 4px solid var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 24px;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-bar {
                flex-direction: column;
            }

            .search-bar input,
            .search-bar select {
                width: 100%;
            }

            .nav-tabs {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function TourismApp() {
            const [page, setPage] = useState('home');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginData, setLoginData] = useState({ username: '', password: '' });

            // States
            const [cities, setCities] = useState([
                { id: 1, name: 'طرابلس', description: 'عاصمة ليبيا الجميلة' },
                { id: 2, name: 'درنة', description: 'لؤلؤة الساحل الليبي' }
            ]);

            const [places, setPlaces] = useState([
                {
                    id: 1,
                    name: 'قلعة درنة التاريخية',
                    cityId: 2,
                    category: 'تاريخي',
                    description: 'قلعة عثمانية قديمة تطل على البحر المتوسط',
                    image: 'https://via.placeholder.com/400x250/667eea/ffffff?text=قلعة+درنة',
                    lat: 32.7647,
                    lng: 22.6547,
                    phone: '+218913456789'
                }
            ]);

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCity, setSelectedCity] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');

            // New City/Place Forms
            const [newCity, setNewCity] = useState({ name: '', description: '' });
            const [newPlace, setNewPlace] = useState({
                name: '',
                cityId: '',
                category: '',
                description: '',
                image: '',
                lat: '',
                lng: '',
                phone: ''
            });

            const categories = ['تاريخي', 'طبيعي', 'ديني', 'متحف', 'رياضي', 'تسوق', 'ترفيهي'];

            // Handlers
            const handleLogin = (e) => {
                e.preventDefault();
                if (loginData.username === 'admin' && loginData.password === 'admin123') {
                    setIsLoggedIn(true);
                    setPage('admin');
                } else {
                    alert('بيانات دخول غير صحيحة!');
                }
            };

            const handleAddCity = (e) => {
                e.preventDefault();
                if (!newCity.name.trim()) {
                    alert('أدخل اسم المدينة');
                    return;
                }
                setCities([...cities, {
                    id: Math.max(...cities.map(c => c.id), 0) + 1,
                    name: newCity.name,
                    description: newCity.description
                }]);
                setNewCity({ name: '', description: '' });
                alert('✅ تمت إضافة المدينة بنجاح!');
            };

            const handleAddPlace = (e) => {
                e.preventDefault();
                if (!newPlace.name || !newPlace.cityId || !newPlace.category) {
                    alert('⚠️ أدخل جميع المعلومات المطلوبة');
                    return;
                }
                setPlaces([...places, {
                    ...newPlace,
                    id: Math.max(...places.map(p => p.id), 0) + 1,
                    cityId: parseInt(newPlace.cityId),
                    lat: parseFloat(newPlace.lat) || '',
                    lng: parseFloat(newPlace.lng) || ''
                }]);
                setNewPlace({
                    name: '',
                    cityId: '',
                    category: '',
                    description: '',
                    image: '',
                    lat: '',
                    lng: '',
                    phone: ''
                });
                alert('✅ تمت إضافة المكان بنجاح!');
            };

            const handleDeleteCity = (id) => {
                if (confirm('⚠️ هل أنت متأكد من حذف المدينة؟')) {
                    setCities(cities.filter(c => c.id !== id));
                    setPlaces(places.filter(p => p.cityId !== id));
                    alert('✅ تم الحذف بنجاح');
                }
            };

            const handleDeletePlace = (id) => {
                if (confirm('⚠️ هل أنت متأكد من حذف المكان؟')) {
                    setPlaces(places.filter(p => p.id !== id));
                    alert('✅ تم الحذف بنجاح');
                }
            };

            const getCityName = (cityId) => {
                return cities.find(c => c.id === cityId)?.name || 'غير معروفة';
            };

            const filteredPlaces = places.filter(place => {
                const matchSearch = place.name.includes(searchQuery) || place.description.includes(searchQuery);
                const matchCity = !selectedCity || place.cityId === parseInt(selectedCity);
                const matchCategory = !selectedCategory || place.category === selectedCategory;
                return matchSearch && matchCity && matchCategory;
            });

            const openGoogleMaps = (lat, lng, name) => {
                const url = `https://www.google.com/maps/search/${encodeURIComponent(name)}/@${lat},${lng},15z`;
                window.open(url, '_blank');
            };

            if (!isLoggedIn && page === 'admin') {
                return (
                    <div className="login-container">
                        <div className="login-form">
                            <h2>🔐 دخول الإدارة</h2>
                            <form onSubmit={handleLogin}>
                                <div className="form-group">
                                    <label>اسم المستخدم</label>
                                    <input
                                        type="text"
                                        value={loginData.username}
                                        onChange={(e) => setLoginData({...loginData, username: e.target.value})}
                                        placeholder="admin"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>كلمة المرور</label>
                                    <input
                                        type="password"
                                        value={loginData.password}
                                        onChange={(e) => setLoginData({...loginData, password: e.target.value})}
                                        placeholder="admin123"
                                    />
                                </div>
                                <button type="submit" className="btn btn-primary" style={{width: '100%', marginTop: '20px'}}>
                                    دخول
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-wrapper">
                    {/* Header */}
                    <div className="header">
                        <div className="header-title">
                            <span className="logo-icon">🌍</span>
                            <h1>تطبيق السياحة الذكي</h1>
                        </div>
                        <div className="nav-tabs">
                            {isLoggedIn && (
                                <>
                                    <button className={`tab-btn ${page === 'home' ? 'active' : ''}`} onClick={() => setPage('home')}>
                                        🏠 الرئيسية
                                    </button>
                                    <button className={`tab-btn ${page === 'admin' ? 'active' : ''}`} onClick={() => setPage('admin')}>
                                        ⚙️ الإدارة
                                    </button>
                                    <button className="tab-btn" onClick={() => { setIsLoggedIn(false); setPage('home'); }}>
                                        🚪 خروج
                                    </button>
                                </>
                            )}
                            {!isLoggedIn && (
                                <button className={`tab-btn ${page === 'admin' ? 'active' : ''}`} onClick={() => setPage('admin')}>
                                    🔐 إدارة
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Home Page */}
                    {page === 'home' && (
                        <>
                            {/* Stats */}
                            <div className="stats-grid">
                                <div className="stat-card">
                                    <div className="stat-number">{cities.length}</div>
                                    <div className="stat-label">مدينة سياحية</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{places.length}</div>
                                    <div className="stat-label">مكان سياحي</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{filteredPlaces.length}</div>
                                    <div className="stat-label">نتيجة البحث</div>
                                </div>
                            </div>

                            {/* Search */}
                            <div className="search-bar">
                                <input
                                    type="text"
                                    placeholder="🔍 ابحث عن مكان..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                                <select value={selectedCity} onChange={(e) => setSelectedCity(e.target.value)}>
                                    <option value="">جميع المدن</option>
                                    {cities.map(city => (
                                        <option key={city.id} value={city.id}>{city.name}</option>
                                    ))}
                                </select>
                                <select value={selectedCategory} onChange={(e) => setSelectedCategory(e.target.value)}>
                                    <option value="">جميع الفئات</option>
                                    {categories.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                </select>
                            </div>

                            {/* Places Grid */}
                            {filteredPlaces.length === 0 ? (
                                <div className="card" style={{textAlign: 'center', padding: '40px'}}>
                                    <div className="empty-icon">😔</div>
                                    <p style={{fontSize: '16px', color: '#a0aec0'}}>لم يتم العثور على أماكن</p>
                                </div>
                            ) : (
                                <div className="content">
                                    {filteredPlaces.map(place => (
                                        <div key={place.id} className="card">
                                            <div className="card-header">
                                                <span className="card-icon">📍</span>
                                                <div>
                                                    <div className="card-title">{place.name}</div>
                                                    <div className="card-subtitle">📍 {getCityName(place.cityId)}</div>
                                                </div>
                                            </div>
                                            {place.image && <img src={place.image} alt={place.name} className="card-image" />}
                                            <div className="badge-container">
                                                <span className="badge">🏷️ {place.category}</span>
                                            </div>
                                            <p className="card-text">{place.description}</p>
                                            {(place.lat && place.lng) && (
                                                <div className="location-info">
                                                    📍 {place.lat.toFixed(4)}, {place.lng.toFixed(4)}
                                                </div>
                                            )}
                                            <div className="button-group">
                                                {place.lat && place.lng && (
                                                    <button
                                                        className="btn btn-info btn-small"
                                                        onClick={() => openGoogleMaps(place.lat, place.lng, place.name)}
                                                    >
                                                        🗺️ خريطة جوجل
                                                    </button>
                                                )}
                                                {place.phone && (
                                                    <button
                                                        className="btn btn-success btn-small"
                                                        onClick={() => window.location.href = `tel:${place.phone}`}
                                                    >
                                                        📞 اتصل الآن
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}

                    {/* Admin Page */}
                    {page === 'admin' && isLoggedIn && (
                        <>
                            {/* Cities Management */}
                            <div className="form-section">
                                <div className="form-title">🏙️ إدارة المدن</div>
                                <form onSubmit={handleAddCity}>
                                    <div className="form-grid">
                                        <div className="form-group">
                                            <label>اسم المدينة *</label>
                                            <input
                                                type="text"
                                                value={newCity.name}
                                                onChange={(e) => setNewCity({...newCity, name: e.target.value})}
                                                placeholder="مثال: الإسكندرية"
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>الوصف</label>
                                            <input
                                                type="text"
                                                value={newCity.description}
                                                onChange={(e) => setNewCity({...newCity, description: e.target.value})}
                                                placeholder="وصف المدينة الجميل"
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="btn btn-success">
                                        ➕ إضافة مدينة جديدة
                                    </button>
                                </form>

                                {/* Cities List */}
                                <div className="table-responsive">
                                    <table className="table">
                                        <thead>
                                            <tr>
                                                <th>المدينة</th>
                                                <th>الوصف</th>
                                                <th>عدد الأماكن</th>
                                                <th>الإجراءات</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {cities.map(city => (
                                                <tr key={city.id}>
                                                    <td><strong>🏙️ {city.name}</strong></td>
                                                    <td>{city.description || '-'}</td>
                                                    <td><strong>{places.filter(p => p.cityId === city.id).length}</strong></td>
                                                    <td>
                                                        <button
                                                            className="btn btn-danger btn-small"
                                                            onClick={() => handleDeleteCity(city.id)}
                                                        >
                                                            🗑️ حذف
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Places Management */}
                            <div className="form-section">
                                <div className="form-title">📍 إضافة أماكن سياحية</div>
                                <form onSubmit={handleAddPlace}>
                                    <div className="form-grid">
                                        <div className="form-group">
                                            <label>اسم المكان *</label>
                                            <input
                                                type="text"
                                                value={newPlace.name}
                                                onChange={(e) => setNewPlace({...newPlace, name: e.target.value})}
                                                placeholder="مثال: الهرم الأكبر"
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>المدينة *</label>
                                            <select
                                                value={newPlace.cityId}
                                                onChange={(e) => setNewPlace({...newPlace, cityId: e.target.value})}
                                                required
                                            >
                                                <option value="">اختر المدينة</option>
                                                {cities.map(city => (
                                                    <option key={city.id} value={city.id}>{city.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label>الفئة *</label>
                                            <select
                                                value={newPlace.category}
                                                onChange={(e) => setNewPlace({...newPlace, category: e.target.value})}
                                                required
                                            >
                                                <option value="">اختر فئة</option>
                                                {categories.map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label>الوصف</label>
                                        <textarea
                                            value={newPlace.description}
                                            onChange={(e) => setNewPlace({...newPlace, description: e.target.value})}
                                            placeholder="وصف المكان بالتفصيل..."
                                        />
                                    </div>
                                    <div className="form-grid">
                                        <div className="form-group">
                                            <label>رابط الصورة</label>
                                            <input
                                                type="text"
                                                value={newPlace.image}
                                                onChange={(e) => setNewPlace({...newPlace, image: e.target.value})}
                                                placeholder="https://via.placeholder.com/..."
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>خط العرض (Latitude)</label>
                                            <input
                                                type="number"
                                                step="0.0001"
                                                value={newPlace.lat}
                                                onChange={(e) => setNewPlace({...newPlace, lat: e.target.value})}
                                                placeholder="32.8872"
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>خط الطول (Longitude)</label>
                                            <input
                                                type="number"
                                                step="0.0001"
                                                value={newPlace.lng}
                                                onChange={(e) => setNewPlace({...newPlace, lng: e.target.value})}
                                                placeholder="13.1913"
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>رقم الهاتف</label>
                                            <input
                                                type="tel"
                                                value={newPlace.phone}
                                                onChange={(e) => setNewPlace({...newPlace, phone: e.target.value})}
                                                placeholder="+218912345678"
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="btn btn-success">
                                        ✅ إضافة المكان
                                    </button>
                                </form>

                                {/* Places List */}
                                <div className="table-responsive">
                                    <table className="table">
                                        <thead>
                                            <tr>
                                                <th>المكان</th>
                                                <th>المدينة</th>
                                                <th>الفئة</th>
                                                <th>الإجراءات</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {places.map(place => (
                                                <tr key={place.id}>
                                                    <td><strong>{place.name}</strong></td>
                                                    <td>{getCityName(place.cityId)}</td>
                                                    <td>{place.category}</td>
                                                    <td>
                                                        <button
                                                            className="btn btn-danger btn-small"
                                                            onClick={() => handleDeletePlace(place.id)}
                                                        >
                                                            🗑️ حذف
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.render(<TourismApp />, document.getElementById('root'));
    </script>
</body>
</html>
